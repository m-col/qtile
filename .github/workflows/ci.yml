name: ci

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-20.04
        name: "python ${{ matrix.python-version }}"
        env:
          # This commit is shortly after 0.13.0, when pixman software renderer was implemented
          #WLROOTS: bcabe34a2edc71fef338cd770e851a43b68484cf
          #WLROOTS: fd2b1f018e8e736c40ee31949e818e0b6939e308
          WLROOTS: master
          WAYLAND: 1.19.0
          SEATD: 0.5.0
        strategy:
            matrix:
                # if you change one of these, be sure to update
                # /tox.ini:[gh-actions] as well
                python-version: [pypy-3.7, 3.7, 3.8, 3.9]
        steps:
            - uses: actions/checkout@v2
            - name: Set up python ${{ matrix.python-version }}
              uses: actions/setup-python@v2
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install dependencies
              run: |
                sudo apt update
                sudo apt install --no-install-recommends \
                  libdbus-1-dev libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-notify-0.7 gir1.2-gudev-1.0 \
                  graphviz imagemagick libpulse-dev lm-sensors xserver-xephyr xterm xvfb x11-apps ninja-build \
                  wayland-protocols libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libinput-dev \
                  libxkbcommon-dev libpixman-1-dev
                sudo pip -q install tox tox-gh-actions meson
            - name: Build wayland
              run: |
                wget -q --no-check-certificate https://wayland.freedesktop.org/releases/wayland-$WAYLAND.tar.xz
                tar -xJf wayland-$WAYLAND.tar.xz
                cd wayland-$WAYLAND
                meson build -Ddocumentation=false --prefix=/usr
                ninja -C build
                sudo ninja -C build install
            - name: Build seatd
              run: |
                wget -q --no-check-certificate https://git.sr.ht/~kennylevinsen/seatd/archive/$SEATD.tar.gz
                tar -xzf $SEATD.tar.gz
                cd seatd-$SEATD
                meson build --prefix=/usr
                ninja -C build
                sudo ninja -C build install
            - name: Build wlroots
              run: |
                wget -q --no-check-certificate https://github.com/swaywm/wlroots/archive/$WLROOTS.tar.gz
                tar -xzf $WLROOTS.tar.gz
                cd wlroots-$WLROOTS
                meson build -Dexamples=false --prefix=/usr
                ninja -C build
                sudo ninja -C build install
            - name: run tests
              run: |
                [ "$(grep -c -P '\t' CHANGELOG)" = "0" ]
                tox
